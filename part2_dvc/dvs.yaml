stages:
  get_data:
    cmd: python scripts/data.py
    deps:
      - scripts/data.py
    params:
      - table
      - output_path
      - sslmode
    outs:
      - data/initial_data.csv

  split_data:
    cmd: python scripts/split.py
    deps:
      - data/initial_data.csv
      - scripts/split.py
    params:
      - data.initial_data_path
      - data.train_path
      - data.val_path
      - data.target_col
      - split.test_size
      - split.random_state
      - split.group_col
    outs:
      - data/train.csv
      - data/val.csv

  fit_model:
    cmd: python scripts/fit.py
    deps:
      - data/train.csv
      - scripts/fit.py
    params:
      - data.train_path
      - data.model_path
      - data.target_col
      - model.iterations
      - model.learning_rate
      - model.depth
      - model.loss_function
      - model.random_state
      - model.verbose
    outs:
      - models/fitted_model.pkl

  evaluate_model:
    cmd: python scripts/evaluate.py
    deps:
      - data/val.csv
      - models/fitted_model.pkl
      - scripts/evaluate.py
    params:
      - data.val_path
      - data.model_path
      - data.target_col
      - evaluate.metrics_path
    metrics:
      - cv_results/metrics.json:
          cache: false