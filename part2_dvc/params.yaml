# ============================================================
# Параметры подключения к источнику данных (используется в data.py)
# ============================================================
table: buildings_flats              # имя таблицы-источника в БД
output_path: data/initial_data.csv  # куда сохранить выгруженный CSV
sslmode: disable                    # режим SSL для подключения к PostgreSQL


# ============================================================
# Пути к артефактам и целевая переменная
# (используется в split.py, fit.py, evaluate.py)
# ============================================================
data:
  initial_data_path: data/initial_data.csv  # входной датасет
  train_path: data/train.csv                # обучающая выборка
  val_path: data/val.csv                    # валидационная выборка
  model_path: models/fitted_model.pkl       # обученная модель
  target_col: price                         # целевая переменная


# ============================================================
# Параметры разбиения данных (используется в split.py)
# ============================================================
split:
  test_size: 0.2        # доля валидационной выборки
  random_state: 42      # seed для воспроизводимости


# ============================================================
# Гиперпараметры модели (используется в fit.py)
# ============================================================
model:
  iterations: 1000        # число деревьев в CatBoost
  learning_rate: 0.05     # скорость обучения
  depth: 6                # глубина деревьев
  loss_function: RMSE     # функция потерь
  random_state: 42        # seed для воспроизводимости
  verbose: 100            # частота логирования


# ============================================================
# Параметры оценки модели (используется в evaluate.py)
# ============================================================
evaluate:
  metrics_path: cv_results/metrics.json  # куда сохранить метрики